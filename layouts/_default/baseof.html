<!DOCTYPE html>
<html lang="en">

{{ partial "head.html" . }}

<script type="module">
    import * as pagefind from "/pagefind/pagefind.js";
    window.pagefind = pagefind;
</script>

<body>

    {{ if hugo.IsServer }}
        {{ partial "author-bar.html" . }}
    {{ end }}

    {{ if ne .Layout "editor-test" }}
        {{ partial "header.html" . }}
    {{ end }}

    {{ block "main" . }}{{ end }}

    {{ if ne .Layout "editor-test" }}
        {{ partial "footer.html" . }}
    {{ end }}

</body>

</html>
