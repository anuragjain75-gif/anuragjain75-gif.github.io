<header data-pagefind-ignore>

<div class="site-emblem">
    <img src="/images/tree-logo.png" alt="Lilamaya emblem">
</div>

<h1>{{ .Site.Title }}</h1>

<p class="tagline">
{{ .Site.Params.tagline }}

</p>

</header>

<nav class="main-nav">

<a href="{{ "/" | relURL }}">Home</a>

<a href="{{ "essays/" | relURL }}">Essays</a>

<a href="{{ "fragments/" | relURL }}">Fragments</a>

<a href="{{ "paintings/" | relURL }}">Paintings</a>

<a href="{{ "books/" | relURL }}">Books</a>

<a href="{{ "about/" | relURL }}">About</a>

<a href="/subscribe/">Subscribe</a>

<a href="/support/">Support</a>

<button class="nav-search"
        type="button"
        aria-label="Search Lilamaya"
        aria-expanded="false"
        aria-controls="global-search">

    <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
        focusable="false">
        <circle cx="10.8" cy="10.8" r="6.8"></circle>
        <line x1="16" y1="16" x2="21" y2="21"></line>
    </svg>

</button>

</nav>

<div id="global-search" class="global-search" hidden data-pagefind-ignore>

    {{ partial "search.html" . }}

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const button = document.querySelector(".nav-search");
    const search = document.getElementById("global-search");
    const input = document.getElementById("search-input");
    const results = document.getElementById("search-results");

    if (!button || !search || !input) return;

    button.addEventListener("click", () => {

        const isOpen = !search.hidden;

        search.hidden = isOpen;

        button.setAttribute(
            "aria-expanded",
            String(!isOpen)
        );

        if (!isOpen) {

            requestAnimationFrame(() => {
                input.focus();
            });

        } else {

            input.value = "";

            if (results) {
                results.innerHTML = "";
            }

        }

    });

});
</script>
