<header data-pagefind-ignore>

    <div class="site-emblem">
        <img src="/images/tree-logo.png" alt="Lilamaya emblem">
    </div>

    <h1>{{ .Site.Title }}</h1>

    <p class="tagline">
        {{ .Site.Params.tagline }}
    </p>

</header>

<nav class="main-nav" aria-label="Main navigation">

    <a href="{{ "/" | relURL }}">Home</a>

    <details class="nav-dropdown{{ if in (slice "explore" "people" "works" "ideas" "traditions" "places") .Section }} active-page{{ end }}">

        <summary>Explore</summary>

        <div class="nav-dropdown-menu">
            <a href="{{ "explore/" | relURL }}">Explore all</a>
            <a href="{{ "people/" | relURL }}">People</a>
            <a href="{{ "works/" | relURL }}">Works</a>
            <a href="{{ "ideas/" | relURL }}">Ideas</a>
            <a href="{{ "traditions/" | relURL }}">Traditions</a>
            <a href="{{ "places/" | relURL }}">Places</a>
        </div>

    </details>

    <details class="nav-dropdown{{ if in (slice "writings" "essays" "fragments" "paintings" "books") .Section }} active-page{{ end }}">

        <summary>Writings</summary>

        <div class="nav-dropdown-menu">
            <a href="{{ "writings/" | relURL }}">All writings</a>
            <a href="{{ "essays/" | relURL }}">Essays</a>
            <a href="{{ "fragments/" | relURL }}">Fragments</a>
            <a href="{{ "paintings/" | relURL }}">Paintings</a>
            <a href="{{ "books/" | relURL }}">Books</a>
        </div>

    </details>

    <a href="{{ "journeys/" | relURL }}"{{ if eq .Section "journeys" }} class="active-page" aria-current="page"{{ end }}>Journeys</a>

    <a href="{{ "about/" | relURL }}"{{ if eq .RelPermalink "/about/" }} class="active-page" aria-current="page"{{ end }}>About</a>

    <a href="{{ "subscribe/" | relURL }}"{{ if eq .RelPermalink "/subscribe/" }} class="active-page" aria-current="page"{{ end }}>Subscribe</a>

    <a href="{{ "support/" | relURL }}"{{ if eq .RelPermalink "/support/" }} class="active-page" aria-current="page"{{ end }}>Support</a>

    <button class="nav-search"
            type="button"
            aria-label="Search Lilamaya"
            aria-expanded="false"
            aria-controls="global-search">

        <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false">
            <circle cx="10.8" cy="10.8" r="6.8"></circle>
            <line x1="16" y1="16" x2="21" y2="21"></line>
        </svg>

    </button>

</nav>

<div id="global-search" class="global-search" hidden data-pagefind-ignore>

    {{ partial "search.html" . }}

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    /* =====================================
       SEARCH
       ===================================== */

    const button = document.querySelector(".nav-search");
    const search = document.getElementById("global-search");
    const input = document.getElementById("search-input");
    const results = document.getElementById("search-results");

    if (button && search && input) {

        button.addEventListener("click", () => {

            const isOpen = !search.hidden;

            search.hidden = isOpen;

            button.setAttribute(
                "aria-expanded",
                String(!isOpen)
            );

            if (!isOpen) {

                requestAnimationFrame(() => {
                    input.focus();
                });

            } else {

                input.value = "";

                if (results) {
                    results.innerHTML = "";
                }

            }

        });

    }


    /* =====================================
       NAVIGATION DROPDOWNS
       ===================================== */

    const dropdowns = document.querySelectorAll(".nav-dropdown");

    const desktopHover = window.matchMedia(
        "(hover: hover) and (pointer: fine)"
    );

    if (desktopHover.matches) {

        dropdowns.forEach((dropdown) => {

            dropdown.addEventListener("pointerenter", () => {
                dropdown.open = true;
            });

            dropdown.addEventListener("pointerleave", () => {

                if (!dropdown.matches(":focus-within")) {
                    dropdown.open = false;
                }

            });

            dropdown.addEventListener("focusin", () => {
                dropdown.open = true;
            });

            dropdown.addEventListener("focusout", (event) => {

                if (
                    !dropdown.contains(event.relatedTarget) &&
                    !dropdown.matches(":hover")
                ) {
                    dropdown.open = false;
                }

            });

        });

    }

});
</script>
