name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment_attempt_3.outputs.page_url || steps.deployment_attempt_2.outputs.page_url || steps.deployment_attempt_1.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.123.7"
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Node dependencies
        run: npm ci

      - name: Build Hugo site
        run: hugo --gc --minify

      - name: Build Pagefind index
        run: npx pagefind --site public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

# Automatic Pages deployment retries
      - name: Deploy to GitHub Pages (attempt 1)
        continue-on-error: true
        id: deployment_attempt_1
        uses: actions/deploy-pages@v5
      - name: Wait before Pages deployment retry (attempt 2)
        if: steps.deployment_attempt_1.outcome == 'failure'
        run: sleep 15
      - name: Deploy to GitHub Pages (attempt 2)
        continue-on-error: true
        if: steps.deployment_attempt_1.outcome == 'failure'
        id: deployment_attempt_2
        uses: actions/deploy-pages@v5
      - name: Wait before Pages deployment retry (attempt 3)
        if: steps.deployment_attempt_1.outcome == 'failure' && steps.deployment_attempt_2.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (attempt 3)
        if: steps.deployment_attempt_1.outcome == 'failure' && steps.deployment_attempt_2.outcome == 'failure'
        id: deployment_attempt_3
        uses: actions/deploy-pages@v5
